<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TINAXE Student Tracker</title>
<style>
body{font-family:Arial;padding:12px;background:#f2f2f2}
h1{text-align:center;color:#1a73e8}
.card{background:white;padding:14px;border-radius:10px;margin:10px 0}
input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;font-size:16px}
button{background:#1a73e8;color:white;border:none;font-weight:bold}
button.green{background:#0a9d4a}
.paid{color:green;font-weight:bold}
.owing{color:red;font-weight:bold}
</style>
</head>
<body>
<h1>TINAXE Study Group</h1>
<p style="text-align:center">Student Payment & Performance Tracker</p>

<div class="card">
<h3>Add Student</h3>
<input id="sName" placeholder="Full Name">
<input id="sClass" placeholder="Class e.g. Form 2A">
<input id="sPhone" placeholder="Phone">
