<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TINAXE Student Tracker</title>
<style>
body{font-family:Arial;padding:12px;background:#f2f2f2}
h1{text-align:center;color:#1a73e8}
.card{background:white;padding:14px;border-radius:10px;margin:10px 0}
input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;font-size:16px}
button{background:#1a73e8;color:white;border:none;font-weight:bold}
button.green{background:#0a9d4a}
.paid{color:green;font-weight:bold}
.owing{color:red;font-weight:bold}
</style>
</head>
<body>
<h1>TINAXE Study Group</h1>
<p style="text-align:center">Student Payment & Performance Tracker</p>

<div class="card">
<h3>Add Student</h3>
<input id="sName" placeholder="Full Name">
<input id="sClass" placeholder="Class e.g. Form 2A">
<input id="sPhone" placeholder="Phone">
<input id="sFees" type="number" placeholder="Total Fees e.g. 150">
<button onclick="addStudent()">Add Student</button>
</div>

<div class="card">
<h3>Record Payment / Mark</h3>
<select id="selStudent"></select>
<input id="pAmount" type="number" placeholder="Payment Amount">
<select id="pMethod"><option>Cash</option><option>EcoCash</option><option>Bank</option></select>
<button class="green" onclick="addPayment()">Save Payment</button>
<hr>
<input id="mSubject" placeholder="Subject e.g. Maths">
<input id="mScore" type="number" placeholder="Mark /100">
<button onclick="addMark()">Save Mark</button>
</div>

<div class="card">
<input id="search" placeholder="Search student..." oninput="render()">
<button onclick="exportCSV()">Export to Excel (CSV)</button>
</div>

<div id="list"></div>

<script>
let students=JSON.parse(localStorage.getItem('students')||'[]');
function save(){localStorage.setItem('students',JSON.stringify(students));render();}
function addStudent(){
let s={id:Date.now(),name:document.getElementById('sName').value,cls:document.getElementById('sClass').value,phone:document.getElementById('sPhone').value,fees:+document.getElementById('sFees').value,payments:[],marks:[]};
if(!s.name) return alert('Enter name');
students.push(s);save();alert('Student added');
}
function addPayment(){
let id=+document.getElementById('selStudent').value;
let st=students.find(x=>x.id===id);
let amt=+document.getElementById('pAmount').value;
let method=document.getElementById('pMethod').value;
if(!amt) return alert('Enter amount');
st.payments.push({amt,method,date:new Date().toLocaleDateString()});
save();alert('Payment saved');
}
function addMark(){
let id=+document.getElementById('selStudent').value;
let st=students.find(x=>x.id===id);
let sub=document.getElementById('mSubject').value;
let score=+document.getElementById('mScore').value;
if(!sub) return alert('Enter subject');
st.marks.push({sub,score});
save();alert('Mark saved');
}
function render(){
let q=(document.getElementById('search').value||'').toLowerCase();
let sel=document.getElementById('selStudent');
sel.innerHTML=students.map(s=>`<option value="${s.id}">${s.name} - ${s.cls}</option>`).join('');
let html='';
students.filter(s=>s.name.toLowerCase().includes(q)).forEach(s=>{
let paid=s.payments.reduce((a,b)=>a+b.amt,0);
let bal=s.fees-paid;
let avg=s.marks.length?(s.marks.reduce((a,b)=>a+b.score,0)/s.marks.length).toFixed(1):'No marks';
html+=`<div class="card"><b>${s.name}</b> - ${s.cls}<br>Fees: $${s.fees} | Paid: <span class="paid">$${paid}</span> | Balance: <span class="owing">$${bal}</span><br>Average: ${avg}%<br>Payments: ${s.payments.map(p=>p.date+': $'+p.amt).join(' | ')||'None'}<br>Marks: ${s.marks.map(m=>m.sub+': '+m.score).join(' | ')||'None'}</div>`;
});
document.getElementById('list').innerHTML=html||'<p>No students yet</p>';
}
function exportCSV(){
let csv='Name,Class,Phone,Fees,Paid,Balance,Average\n';
students.forEach(s=>{
let paid=s.payments.reduce((a,b)=>a+b.amt,0);
let avg=s.marks.length?(s.marks.reduce((a,b)=>a+b.score,0)/s.marks.length).toFixed(1):'';
csv+=`${s.name},${s.cls},${s.phone},${s.fees},${paid},${s.fees-paid},${avg}\n`;
});
let a=document.createElement('a');a.href='data:text/csv,[STRIPPED] a.download='students.csv';a.click();
}
render();
</script>
</body>
</html>
